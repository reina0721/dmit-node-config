[package]
name = "nodectl"
default-run = "nodectl"
version = "0.6.5"
edition = "2024"
rust-version = "1.99.1"
repository = "https://github.com/reina0721/dmit-node-config"
description = "Transactional configuration management for a bare-metal Xray node"
license = "MIT"

[dependencies]
anyhow = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "sync", "macros"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
hex = "0.4"
httparse = "1.10.1"
libc = "0.2"
minijinja = "2"
rand = "0.8"
regex = "1"
percent-encoding = "2"
unicode-general-category = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "2"
subtle = "2.6.1"
tempfile = "3"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }

[features]
# Only isolated integration builds include explicit fault injection.
integration-test = []

[profile.release]
lto = true
strip = true

