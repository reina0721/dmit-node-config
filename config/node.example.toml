schema_version = 1
# DMIT node configuration with full standard WARP, CN WARP, and companion services.
# Outbound traffic uses native DMIT routing by default, with China destinations
# routed through an isolated CN WARP instance (table 5271, fwmark 5271).

[node]
# Tutorial names in docs/deployment.md; replace documentation IPs before apply.
domain = "speedtest.example.com"
aliases = []
reality_domain = "files.example.com"
ipv4 = "203.0.113.10"
ipv6 = "2001:db8::10"

[vless]
encryption = true

[ports]
http = 80
https = 443
reality = 8443

[transport.xhttp]
path = "/assets/modules/6b91d4e8a37fc205/stream/"
mode = "stream-one"
socket = "/tmp/vless-xhttp.socket"

[transport.ws]
path = "/api/events/c84f20a7d693be51/channel"
socket = "/tmp/vless-ws.socket"

[transport.reality]
path = "/assets/modules/a720d96c1e58fb34/stream/"
mode = "stream-one"

[tls]
protocols = ["TLSv1.3"]
http2 = true
http3 = true
alt_svc_max_age = 86400
domain_cert_dir = "/etc/ssl/dmit/domain"
ip_cert_dir = "/etc/ssl/dmit/ip"

[website]
root = "/var/www/html"
# Explicit existing routes, in addition to checking files below root on Linux.
reserved_paths = ["/.well-known/"]

[runtime]
xray_binary = "/usr/local/bin/xray"
nginx_binary = "/usr/sbin/nginx"
usque_binary = "/usr/local/bin/usque"
xray_user = "xray"
nginx_user = "www-data"
log_root = "/var/log"

[clients]
xhttp_weight = 80
ws_weight = 15
reality_weight = 5
fingerprint_weights = { chrome = 5, ios = 2, firefox = 3, qq = 1 }

[warp]
enabled = true
config_file = "/etc/usque/config.json"
take_over_default_route = false

[distribution]
enabled = true

[cn_warp]
enabled = true
interface = "warp-cn"
config_file = "/etc/usque-cn/config.json"
routing_table = 5271
rule_priority = 15271
socket_mark = 5271
geodata_dir = "/var/lib/nodectl-geodata/202610172205"

[web_services]
enabled = true
librespeed_port = 8989
openlist_port = 5244
openlist_data_dir = "/var/lib/nodectl-openlist"
openlist_files_dir = "/var/lib/nodectl-openlist-files"
download_size_mib = 256

